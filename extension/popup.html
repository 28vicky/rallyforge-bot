<!doctype html>
<html><head><meta charset="utf-8"><title>RallyForge iScout Link</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1d1b18;--mute:#77716a;--line:#e6e0d7;--acc:#d9541e;--ok:#1f8a4c;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a18;--card:#252320;--ink:#f1ede6;--mute:#a59e94;--line:#38352f}}
*{box-sizing:border-box}body{margin:0;width:320px;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,"Segoe UI",sans-serif}
header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}h1{font-size:15px;margin:0}header small{color:var(--mute)}
main{padding:14px 16px;display:grid;gap:14px}label{display:grid;gap:6px;font-weight:600;font-size:13px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
.row{display:flex;gap:8px;align-items:center}.row input{width:70px}.row span{color:var(--mute);font-weight:400}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--acc);color:#fff}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.st{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.acts{display:flex;gap:8px;justify-content:flex-end}
</style></head>
<body>
<header><h1>RallyForge iScout Link</h1><small>Keep your iScout page open in Chrome.</small></header>
<main>
  <div class="st"><span id="dot" class="dot"></span><span id="st">Not linked yet</span></div>
  <label>Link code<input id="code" placeholder="From RallyForge: Settings &gt; iScout" autocomplete="off"></label>
  <label>Reload the iScout page
    <select id="mode"><option value="smart">When the list stops changing</option><option value="every">Every few minutes</option><option value="off">Never</option></select>
  </label>
  <div class="row" id="minrow"><span>after</span><input id="min" type="number" min="1" max="60"><span>min</span></div>
  <div class="acts"><button class="ghost" id="test">Test link</button><button id="save">Save</button></div>
</main>
<script src="popup.js"></script>
</body></html>
